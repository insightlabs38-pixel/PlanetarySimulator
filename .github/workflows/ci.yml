name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check sim.js
          node --check sim.mjs
          node --check physics-core.mjs
      - name: Physics tests
        run: node tests/physics.test.mjs
